# Docker secrets override for 2ndBrain.ceo.
#
# Layers file-based secrets on top of the base compose file. Each secret is
# mounted read-only at /run/secrets/<NAME>; the image entrypoint
# (scripts/docker-entrypoint.sh) exports every non-empty one as an env var,
# taking precedence over the same key in .env.
#
# Usage:
#   1. scripts/init-secrets.sh          # scaffold ./secrets/* (generate + import from .env)
#   2. scripts/set-secret.sh SUPABASE_SERVICE_ROLE_KEY   # fill any that are still empty
#   3. docker compose -f docker-compose.yml -f docker-compose.secrets.yml up --build
#
# Tip: export COMPOSE_FILE=docker-compose.yml:docker-compose.secrets.yml to avoid
# repeating the -f flags on every command.
#
# Keep this list in sync with scripts/secrets.list.

services:
  web:
    secrets:
      - OPENCLAW_SSH_TOKEN_SECRET
      - GYNE_AGENT_SESSION_SECRET
      - PSLE_ENG_TUTOR_SESSION_SECRET
      - MOBILE_DEVICE_OPERATOR_SESSION_SECRET
      - NEWS_INTELLIGENCE_DESK_SESSION_SECRET
      - MARKETPLACE_LAUNCH_VERIFY_SECRET
      - MARKETPLACE_RENEWAL_SECRET
      - SUPABASE_SERVICE_ROLE_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - OPENAI_API_KEY
      - OPENROUTER_API_KEY
      - GWS_OAUTH_CLIENT_SECRET
      - TOKEN_QUOTA_REDIS_URL
      - SOLANA_RPC_URL

secrets:
  OPENCLAW_SSH_TOKEN_SECRET:
    file: ./secrets/OPENCLAW_SSH_TOKEN_SECRET
  GYNE_AGENT_SESSION_SECRET:
    file: ./secrets/GYNE_AGENT_SESSION_SECRET
  PSLE_ENG_TUTOR_SESSION_SECRET:
    file: ./secrets/PSLE_ENG_TUTOR_SESSION_SECRET
  MOBILE_DEVICE_OPERATOR_SESSION_SECRET:
    file: ./secrets/MOBILE_DEVICE_OPERATOR_SESSION_SECRET
  NEWS_INTELLIGENCE_DESK_SESSION_SECRET:
    file: ./secrets/NEWS_INTELLIGENCE_DESK_SESSION_SECRET
  MARKETPLACE_LAUNCH_VERIFY_SECRET:
    file: ./secrets/MARKETPLACE_LAUNCH_VERIFY_SECRET
  MARKETPLACE_RENEWAL_SECRET:
    file: ./secrets/MARKETPLACE_RENEWAL_SECRET
  SUPABASE_SERVICE_ROLE_KEY:
    file: ./secrets/SUPABASE_SERVICE_ROLE_KEY
  AWS_ACCESS_KEY_ID:
    file: ./secrets/AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY:
    file: ./secrets/AWS_SECRET_ACCESS_KEY
  OPENAI_API_KEY:
    file: ./secrets/OPENAI_API_KEY
  OPENROUTER_API_KEY:
    file: ./secrets/OPENROUTER_API_KEY
  GWS_OAUTH_CLIENT_SECRET:
    file: ./secrets/GWS_OAUTH_CLIENT_SECRET
  TOKEN_QUOTA_REDIS_URL:
    file: ./secrets/TOKEN_QUOTA_REDIS_URL
  SOLANA_RPC_URL:
    file: ./secrets/SOLANA_RPC_URL
